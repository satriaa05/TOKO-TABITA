<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f5"/>
      <stop offset="100%" stop-color="#f5e8e2"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd777c"/>
      <stop offset="100%" stop-color="#a45f64"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#804a4e" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/>
  <circle cx="200" cy="140" r="85" fill="#fcf3ee" stroke="#eadbd2" stroke-width="2"/>
  
  <!-- Shopping Bag Modiste Illustration -->
  <g filter="url(#softShadow)">
    <path d="M150 120 L160 210 Q162 218 170 218 L230 218 Q238 218 240 210 L250 120 Z" fill="url(#bagGrad)"/>
    <!-- Fold & Ribbon detail -->
    <path d="M150 120 L250 120 L245 136 L155 136 Z" fill="#914d52"/>
    <!-- Handles -->
    <path d="M175 120 C175 85, 225 85, 225 120" fill="none" stroke="#683438" stroke-width="5" stroke-linecap="round"/>
    <!-- Boutique Star / Diamond Accent -->
    <path d="M200 152 L204 164 L216 168 L204 172 L200 184 L196 172 L184 168 L196 164 Z" fill="#fff" opacity="0.9"/>
  </g>
  
  <text x="200" y="254" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="600" fill="#33261f">Keranjang Masih Kosong</text>
  <text x="200" y="274" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#8c7e77">Jelajahi koleksi busana feminin Tabita Modiste</text>
</svg>
