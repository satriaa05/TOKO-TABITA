<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSearch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f5"/>
      <stop offset="100%" stop-color="#f5e8e2"/>
    </linearGradient>
    <filter id="softShadowSearch" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#804a4e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgSearch)" rx="16"/>
  <circle cx="200" cy="135" r="85" fill="#fcf3ee" stroke="#eadbd2" stroke-width="2"/>
  
  <g filter="url(#softShadowSearch)">
    <circle cx="185" cy="125" r="42" fill="none" stroke="#bd777c" stroke-width="7"/>
    <line x1="216" y1="156" x2="248" y2="188" stroke="#33261f" stroke-width="8" stroke-linecap="round"/>
    <!-- Thread & needle sparkle accent inside lens -->
    <path d="M175 110 Q190 120 180 140" fill="none" stroke="#e3a7ab" stroke-width="3" stroke-linecap="round"/>
    <circle cx="180" cy="140" r="3" fill="#bd777c"/>
  </g>
  
  <text x="200" y="248" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="17" font-weight="600" fill="#33261f">Produk Tidak Ditemukan</text>
  <text x="200" y="268" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#8c7e77">Coba kata kunci lain atau periksa filter kategori</text>
</svg>
