    <filter id="shadow404" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#804a4e" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg404)" rx="20"/>
  <circle cx="250" cy="160" r="110" fill="#fcf3ee" stroke="#eadbd2" stroke-width="2"/>
  
  <!-- Big Stylized 404 with dress mannequin in middle -->
  <g filter="url(#shadow404)">
    <text x="145" y="195" font-family="'Playfair Display', Georgia, serif" font-size="105" font-weight="700" fill="#bd777c" text-anchor="middle">4</text>
    <text x="355" y="195" font-family="'Playfair Display', Georgia, serif" font-size="105" font-weight="700" fill="#bd777c" text-anchor="middle">4</text>
    
