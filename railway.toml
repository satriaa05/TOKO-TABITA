[build]
builder = "docker"
dockerfile = "Dockerfile"
dockerContext = "."

[deploy]
startCommand = "/usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "toko-tabita-web"
source = "."
