# Blueprint deploy Render — TOKO TABITA (free tier)
# Cara pakai: Render Dashboard -> New -> Blueprint -> pilih repo ini.
# Satu service web (gratis, Docker) + satu Postgres gratis (1 GB, kadaluarsa 30 hari).

services:
  - type: web
    name: toko-tabita
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Tabita Modiste
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY          # isi setelah bluepiint dibuat: php artisan key:generate --show
        sync: false
      - key: APP_URL          # isi setelah tahu domain .onrender.com Anda
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tabita-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tabita-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tabita-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tabita-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tabita-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: GOOGLE_CLIENT_ID        # opsional, isi bila mau login Google jalan
        sync: false
      - key: GOOGLE_CLIENT_SECRET    # opsional
        sync: false
      - key: GOOGLE_REDIRECT_URI     # https://<domain-anda>.onrender.com/login/google/callback
        sync: false
      - key: TABITA_STORE_WHATSAPP  # nomor WA toko, mis. 628xxxxxxxxxx
        sync: false
      - key: SEED_DEMO
        value: "false"

databases:
  - name: tabita-db
    plan: free
    databaseName: toko_tabita
    user: toko_tabita
